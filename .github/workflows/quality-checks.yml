# Uptime and performance checks.
#
# Uptime: curls the two production sites every 30 minutes; a failure fails the
# workflow, which triggers GitHub's default failure notification email.
#
# Lighthouse: runs on pushes to main against the built site, with budgets that
# fail the run if performance regresses badly. Advisory rather than blocking —
# it cannot stop a deploy (deploys are direct-upload), but it leaves a public
# record of when a regression landed.

name: Quality checks

on:
  schedule:
    - cron: "*/30 * * * *" # uptime, every 30 minutes (UTC, best-effort timing)
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  uptime:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one site being down must not hide the other's result
      matrix:
        site:
          - url: https://chaseintech.com/
            edge_denial_is_reachable: false
          - url: https://chaseos.ai/
            edge_denial_is_reachable: true
    steps:
      # Retries with backoff, because a single failed probe is not an outage.
      # Datacentre IPs can be challenged by edge protection. For the protected
      # ChaseOS host only, 403/429 proves the edge is reachable; every other
      # non-success response still retries and eventually fails the job.
      - name: Probe ${{ matrix.site.url }}
        run: |
          site="${{ matrix.site.url }}"
          edge_denial_is_reachable="${{ matrix.site.edge_denial_is_reachable }}"
          for attempt in 1 2 3 4; do
            code=$(curl -s -o /dev/null -L --max-time 25 \
              -A "chaseintech-uptime/1.0 (+https://chaseintech.com)" \
              -w "%{http_code}" "$site" || echo "000")
            echo "attempt $attempt: $site -> $code"
            case "$code" in
              2??|3??) echo "OK"; exit 0 ;;
              403|429)
                if [ "$edge_denial_is_reachable" = "true" ]; then
                  echo "::warning::$site returned $code from edge protection; host is reachable"
                  exit 0
                fi
                echo "  unexpected edge denial — retrying"
                ;;
              503) echo "  edge unavailable — retrying" ;;
              *) echo "  unhealthy — retrying" ;;
            esac
            sleep $((attempt * 10))
          done
          echo "::error::$site failed 4 consecutive probes (last code: $code)"
          exit 1

  lighthouse:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse with budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  smoke:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
