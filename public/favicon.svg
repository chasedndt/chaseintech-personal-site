<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- ChaseInTech pixel mark, redrawn from the X profile artwork.
       Swap for the exported original when the source file is supplied. -->
  <rect width="16" height="16" fill="#86d3e8"/>
  <!-- landscape -->
  <rect x="0" y="9" width="5" height="7" fill="#5c9e56"/>
  <rect x="0" y="11" width="5" height="5" fill="#4a7f47"/>
  <rect x="12" y="6" width="4" height="10" fill="#8a6244"/>
  <rect x="13" y="6" width="1" height="10" fill="#6f4d36"/>
  <rect x="9" y="7" width="2" height="9" fill="#b9e7f2" opacity="0.55"/>
  <!-- antennae -->
  <rect x="7" y="0" width="1" height="1" fill="#1b1b1b"/>
  <rect x="10" y="1" width="1" height="1" fill="#1b1b1b"/>
  <rect x="8" y="1" width="1" height="1" fill="#1b1b1b"/>
  <rect x="9" y="2" width="1" height="1" fill="#1b1b1b"/>
  <!-- head -->
  <rect x="5" y="3" width="6" height="1" fill="#1b1b1b"/>
  <rect x="4" y="4" width="1" height="5" fill="#1b1b1b"/>
  <rect x="11" y="4" width="1" height="5" fill="#1b1b1b"/>
  <rect x="5" y="9" width="6" height="1" fill="#1b1b1b"/>
  <rect x="5" y="4" width="6" height="5" fill="#b6b6b6"/>
  <rect x="5" y="4" width="6" height="2" fill="#c9c9c9"/>
  <!-- eyes -->
  <rect x="6" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="9" y="6" width="2" height="2" fill="#ffffff"/>
  <!-- hoodie -->
  <rect x="3" y="10" width="10" height="1" fill="#1b1b1b"/>
  <rect x="3" y="11" width="10" height="5" fill="#a855c8"/>
  <rect x="3" y="11" width="1" height="5" fill="#8e3fae"/>
  <rect x="12" y="11" width="1" height="5" fill="#8e3fae"/>
  <!-- drawstrings -->
  <rect x="7" y="12" width="1" height="3" fill="#f5e17a"/>
  <rect x="9" y="12" width="1" height="3" fill="#f5e17a"/>
